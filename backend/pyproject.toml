[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocas"
version = "1.0.0"
description = "COCAS — Chỉ dẫn phát triển. Hệ thống Desktop tự động tạo hợp đồng từ ảnh CCCD."
authors = [{ name = "Vibecode", email = "ph7mth4ng@gmail.com" }]
license = { text = "UNLICENSED" }
requires-python = ">=3.11"
readme = "README.md"

[project.urls]
Repository = "https://github.com/vibecode/cocas"

# ============================================================================
# PRODUCTION DEPENDENCIES (39 libraries)
# ============================================================================
dependencies = [
    # Web & API (5)
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<2.10.0",
    "pydantic-settings>=2.6.0,<2.7.0",
    "python-multipart>=0.0.12,<0.1.0",

    # Database (4)
    "sqlalchemy[asyncio]>=2.0.0,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg[binary]>=3.2.0,<3.3.0",
    "alembic>=1.14.0,<1.15.0",

    # OCR & Image processing (6)
    "paddlepaddle>=2.6.0,<2.7.0",
    "paddleocr>=2.9.0,<2.10.0",
    "opencv-python-headless>=4.10.0,<4.11.0",
    "pillow>=11.0.0,<12.0.0",
    "pyzbar>=0.1.9,<0.2.0",
    "numpy>=1.26.0,<2.0.0",  # ⭐ CRITICAL: PaddleOCR incompatible with NumPy 2.0

    # Text processing (2)
    "rapidfuzz>=3.10.0,<3.11.0",
    "python-dateutil>=2.9.0,<2.10.0",

    # Document generation (4)
    "docxtpl>=0.18.0,<0.19.0",
    "python-docx>=1.1.0,<1.2.0",
    "jinja2>=3.1.0,<3.2.0",
    "pypdf>=5.1.0,<5.2.0",

    # Security (4)
    "cryptography>=43.0.0,<44.0.0",
    "argon2-cffi>=23.1.0,<23.2.0",
    "pywin32>=308,<309",
    "python-magic-bin>=0.4.14,<0.5.0",

    # Infrastructure (7)
    "loguru>=0.7.0,<0.8.0",
    "tenacity>=9.0.0,<10.0.0",
    "tomlkit>=0.13.0,<0.14.0",
    "uuid-utils>=0.10.0,<0.11.0",
    "psutil>=6.1.0,<6.2.0",
    "orjson>=3.10.0,<3.11.0",
    "anyio>=4.6.0,<4.7.0",
]

[project.optional-dependencies]
dev = [
    # Testing (8)
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "pytest-mock>=3.14.0,<3.15.0",
    "hypothesis>=6.0.0,<7.0.0",
    "factory-boy>=3.3.0,<3.4.0",
    "faker>=24.0.0,<25.0.0",
    "httpx>=0.27.0,<0.28.0",
    "testcontainers[postgres]>=4.0.0,<5.0.0",

    # Code quality (7)
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<1.14.0",
    "import-linter>=2.1.0,<2.2.0",
    "bandit>=1.8.0,<1.9.0",
    "pip-audit>=2.7.0,<2.8.0",
    "detect-secrets>=1.4.0,<1.5.0",
    "gitleaks>=8.18.0,<8.19.0",
    "radon>=6.1.0,<6.2.0",

    # Packaging
    "pyinstaller>=6.11.0,<6.12.0",
    "pre-commit>=3.7.0,<3.8.0",
]

[tool.setuptools]
packages = ["cocas"]

[tool.setuptools.package-dir]
cocas = "src/cocas"

# ============================================================================
# LINTING & TYPE CHECKING
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "C90",   # mccabe complexity
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C",     # flake8-comprehensions
    "ARG",   # flake8-unused-arguments
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # Line length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cocas"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "cocas.infrastructure.*"
strict = false

# ============================================================================
# PYTEST & COVERAGE
# ============================================================================

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src/cocas",
    "--cov-report=term-with-missing",
    "--cov-report=html",
    "--cov-fail-under=0",  # Will set domain/application thresholds in CI
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "security: security tests",
    "chaos: chaos tests",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = ["src/cocas"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ============================================================================
# IMPORT-LINTER: Enforce Dependency Rule
# ============================================================================

[tool.import-linter]
default-strictness = "full"

[[tool.import-linter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "cocas.presentation",
    "cocas.application",
    "cocas.infrastructure",
    "cocas.domain",
]
independent-modules = ["cocas.config"]

[[tool.import-linter.contracts]]
name = "Domain zero-dependency"
type = "forbidden"
source_modules = ["cocas.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "paddleocr",
    "cv2",
    "docxtpl",
    "loguru",
]

[[tool.import-linter.contracts]]
name = "Application no infrastructure"
type = "forbidden"
source_modules = ["cocas.application"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "docxtpl",
    "cv2",
]

[[tool.import-linter.contracts]]
name = "Container exception"
type = "forbidden"
source_modules = [
    "cocas.presentation",
    "cocas.application",
    "cocas.infrastructure",
]
forbidden_modules = []
exception_modules = ["cocas.container"]
