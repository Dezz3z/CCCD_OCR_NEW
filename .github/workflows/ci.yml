name: CI — Lint, Type Check, Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Import Lint, Type Check, Format, Test
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      # ⭐ Windows defaults text-mode file reads to the system codepage (cp1252),
      # which cannot decode the Vietnamese (UTF-8) source/config files —
      # breaks import-linter's own config reader otherwise. See PHASE_P0.md.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e ".[dev]"

      - name: Ruff — Format check
        run: |
          cd backend
          ruff check src tests --select I001,E501,F,W,B
        continue-on-error: false

      - name: Ruff — Linting
        run: |
          cd backend
          ruff check src tests
        continue-on-error: false

      - name: MyPy — Type check (domain + application, strict)
        run: |
          cd backend
          mypy src/cocas/domain src/cocas/application --strict
        continue-on-error: false

      - name: Import-Linter — Enforce Dependency Rule
        run: |
          cd backend
          lint-imports
        continue-on-error: false

      - name: Pytest — Run unit + integration tests
        run: |
          cd backend
          pytest tests/ -v --cov=src/cocas/domain --cov=src/cocas/application --cov-fail-under=85
        continue-on-error: false

      - name: Bandit — Security check
        run: |
          cd backend
          bandit -r src/cocas -ll
        continue-on-error: true

      - name: Pip-audit — Dependency vulnerabilities
        run: |
          cd backend
          pip-audit
        continue-on-error: true

      - name: Gitleaks — Secret scan
        run: |
          choco install gitleaks -y --no-progress
          gitleaks detect --source . --verbose
        continue-on-error: true

  frontend:
    name: Frontend — Type Check, Lint, Test
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: ["18.x", "20.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type check
        run: |
          cd frontend
          npm run type-check
        continue-on-error: false

      - name: ESLint
        run: |
          cd frontend
          npm run lint
        continue-on-error: false

      - name: Vitest — Unit tests
        run: |
          cd frontend
          npm run test
        continue-on-error: false

      - name: Build
        run: |
          cd frontend
          npm run build
        continue-on-error: false

  offline-verification:
    name: Offline Verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no external network calls in code
        run: |
          $pattern = '(http://|https://|requests\.get|requests\.post|socket\.|urllib\.request)'
          $files = Get-ChildItem -Path backend/src -Filter "*.py" -Recurse
          $violations = @()
          foreach ($file in $files) {
            if ($file.FullName -notmatch 'test' -and $file.FullName -notmatch 'mock') {
              $content = Get-Content $file.FullName
              if ($content -match $pattern) {
                $violations += $file.FullName
              }
            }
          }
          if ($violations.Count -gt 0) {
            Write-Error "Found potential external network calls in: $($violations -join ', ')"
            exit 1
          }
        continue-on-error: false
