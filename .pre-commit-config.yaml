repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-json
      - id: mixed-line-ending

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict, --no-error-summary]
        types: [python]
        additional_dependencies:
          [
            pydantic>=2.9,
            fastapi>=0.115,
            sqlalchemy>=2.0,
            types-python-dateutil,
          ]
        exclude: ^(tests/|backend/migrations/)

  - repo: https://github.com/gitleaks/gitleaks-action
    rev: v2.3.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf

ci:
  autoupdate_schedule: quarterly
  skip: []
  autofix_commit_msg: "chore(pre-commit): auto fixes from pre-commit.com hooks"
  autofix_commit_author: "pre-commit-bot <bot@pre-commit.com>"
